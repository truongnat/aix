services:
  kb-server:
    build:
      context: ../..
      dockerfile: services/kb-server/Dockerfile
    ports:
      - '127.0.0.1:${KB_PORT:-4000}:4000'
    environment:
      PORT: '4000'
      KB_HOST: '0.0.0.0'
      KB_DATA_DIR: /data
      KB_MASTER_PASSWORD: ${KB_MASTER_PASSWORD:?set KB_MASTER_PASSWORD in .env}
    volumes:
      - kb_data:/data
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:4000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  kb_data:
